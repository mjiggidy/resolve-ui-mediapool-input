[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-ui-mediapool-input"
version = "0.3.0"
description = "Media Pool Input Controller for Davinci Resolve"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Michael Jordan", email = "michael@glowingpixel.com" }
]
dependencies = [
    "resolve-common @ git+https://github.com/mjiggidy/resolve-common.git@v0.3",
]

[tool.setuptools.packages.find]
where = ["src"]